name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing RWKit release tag; dispatch this workflow at the same tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      file: ${{ steps.pack.outputs.file }}
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate release ref
        id: validate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^rwkit-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$EVENT_REF" == "refs/tags/$RELEASE_TAG" ]]
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("Expected a published stable release") else . end'
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.validate.outputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Check package identity
        env:
          RELEASE_TAG: ${{ steps.validate.outputs.tag }}
        run: node -e 'const assert = require("node:assert/strict"); const p = require("./package.json"); assert.equal(p.name, "rwkit"); assert.equal(process.env.RELEASE_TAG, `rwkit-v${p.version}`); assert.equal(p.repository.url, "git+https://github.com/DepsCian/RWKit.git");'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build
      - run: bun test
      - run: bun run check:package
      - name: Pack release
        id: pack
        run: |
          set -euo pipefail
          mkdir release-artifacts
          npm pack --ignore-scripts --pack-destination release-artifacts --json > "$RUNNER_TEMP/pack.json"
          package_file=$(node -p 'Object.values(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")))[0].filename' "$RUNNER_TEMP/pack.json")
          (cd release-artifacts && sha256sum "$package_file" > "$package_file.sha256")
          printf 'file=%s\n' "$package_file" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-package
          path: release-artifacts/
  attach:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-package
          path: release-artifacts
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release-artifacts/* --clobber
  publish:
    needs: [package, attach]
    if: vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: npm-package
          path: release-artifacts
      - name: Publish verified artifact
        env:
          PACKAGE_FILE: ${{ needs.package.outputs.file }}
        run: |
          set -euo pipefail
          cd release-artifacts
          sha256sum --check "$PACKAGE_FILE.sha256"
          npm publish "$PACKAGE_FILE" --access public --provenance
  bootstrap:
    needs: [package, attach]
    if: vars.NPM_PUBLISH_ENABLED != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: printf '%s\n' 'Npm publishing is disabled. Verified artifacts are attached to the GitHub release for the interactive bootstrap.' >> "$GITHUB_STEP_SUMMARY"
